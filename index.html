<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Catcher</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #121638;
      color: white;
    }

    .game-box {
      width: min(92vw, 500px);
      text-align: center;
    }

    h1 {
      color: #ffe77b;
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .game-area {
      position: relative;
      border: 4px solid #ffe77b;
      border-radius: 18px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      background: linear-gradient(#202866, #7e5a9a);
    }

    .hud {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      pointer-events: none;
    }

    #startScreen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(12, 14, 50, 0.75);
    }

    .card {
      background: #2a2869;
      border: 3px solid #ffe77b;
      border-radius: 18px;
      padding: 24px;
      margin: 20px;
    }

    button {
      border: 0;
      border-radius: 30px;
      background: #ffd35c;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .help { color: #ddd9ff; }
  </style>
</head>

<body>
  <div class="game-box">
    <h1>⭐ Star Catcher ⭐</h1>

    <div class="game-area">
      <canvas id="game" width="500" height="650"></canvas>

      <div class="hud">
        <span id="score">Stars: 0</span>
        <span id="lives">Lives: 3</span>
      </div>

      <div id="startScreen">
        <div class="card">
          <h2 id="title">Ready?</h2>
          <p id="message">Catch the falling stars!<br>Use ← → or A and D.</p>
          <button id="playButton">Play!</button>
        </div>
      </div>
    </div>

    <p class="help">Move using ← → or A / D</p>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("score");
    const livesText = document.getElementById("lives");
    const startScreen = document.getElementById("startScreen");
    const playButton = document.getElementById("playButton");
    const title = document.getElementById("title");
    const message = document.getElementById("message");

    let basket;
    let stars;
    let score;
    let lives;
    let playing = false;
    let left = false;
    let right = false;
    let lastTime = 0;
    let spawnTime = 0;

    function newGame() {
      basket = {
        x: 210,
        y: 580,
        width: 80,
        height: 25,
        speed: 350
      };

      stars = [];
      score = 0;
      lives = 3;
      spawnTime = 0;

      scoreText.textContent = "Stars: 0";
      livesText.textContent = "Lives: 3";
    }

    function makeStar() {
      stars.push({
        x: 25 + Math.random() * 450,
        y: -20,
        size: 12 + Math.random() * 9,
        speed: 140 + Math.random() * 100 + score * 4
      });
    }

    function drawStar(x, y, size) {
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();

      for (let i = 0; i < 10; i++) {
        const radius = i % 2 === 0 ? size : size / 2;
        const angle = -Math.PI / 2 + i * Math.PI / 5;

        if (i === 0) {
          ctx.moveTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
        } else {
          ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
        }
      }

      ctx.closePath();
      ctx.fillStyle = "#fff176";
      ctx.shadowColor = "#fff176";
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // tiny sky dots
      ctx.fillStyle = "white";
      for (const dot of [[50, 80], [140, 170], [400, 110], [450, 330], [90, 400]]) {
        ctx.fillRect(dot[0], dot[1], 3, 3);
      }

      // stars
      for (const star of stars) {
        drawStar(star.x, star.y, star.size);
      }

      // basket
      ctx.fillStyle = "#f08068";
      ctx.fillRect(basket.x, basket.y, basket.width, basket.height);

      ctx.fillStyle = "#ffe0a3";
      ctx.fillRect(basket.x + 8, basket.y + 6, basket.width - 16, 8);

      ctx.fillStyle = "#a94662";
      ctx.fillRect(basket.x + 12, basket.y + basket.height, basket.width - 24, 6);
    }

    function update(delta) {
      if (left) basket.x -= basket.speed * delta;
      if (right) basket.x += basket.speed * delta;

      if (basket.x < 0) basket.x = 0;
      if (basket.x > canvas.width - basket.width) {
        basket.x = canvas.width - basket.width;
      }

      spawnTime += delta;

      if (spawnTime > 0.8) {
        makeStar();
        spawnTime = 0;
      }

      for (let i = stars.length - 1; i >= 0; i--) {
        const star = stars[i];
        star.y += star.speed * delta;

        const caught =
          star.y + star.size > basket.y &&
          star.y - star.size < basket.y + basket.height &&
          star.x > basket.x &&
          star.x < basket.x + basket.width;

        if (caught) {
          stars.splice(i, 1);
          score++;
          scoreText.textContent = "Stars: " + score;
        }

        if (star.y > canvas.height + 30) {
          stars.splice(i, 1);
          lives--;
          livesText.textContent = "Lives: " + lives;

          if (lives <= 0) gameOver();
        }
      }
    }

    function loop(time) {
      if (!playing) return;

      const delta = Math.min((time - lastTime) / 1000, 0.05);
      lastTime = time;

      update(delta);
      draw();

      requestAnimationFrame(loop);
    }

    function startGame() {
      newGame();
      playing = true;

      // This removes the start box completely.
      startScreen.style.display = "none";

      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      playing = false;
      title.textContent = "Game Over!";
      message.textContent = "You caught " + score + " stars!";
      playButton.textContent = "Play Again";
      startScreen.style.display = "grid";
    }

    playButton.addEventListener("click", startGame);

    window.addEventListener("keydown", function (event) {
      if (event.key === "ArrowLeft" || event.key === "a") left = true;
      if (event.key === "ArrowRight" || event.key === "d") right = true;
    });

    window.addEventListener("keyup", function (event) {
      if (event.key === "ArrowLeft" || event.key === "a") left = false;
      if (event.key === "ArrowRight" || event.key === "d") right = false;
    });

    newGame();
    draw();
  </script>
</body>
</html>

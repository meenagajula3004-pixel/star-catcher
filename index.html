<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Catcher</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #313b86, #10132e 65%);
      color: white;
    }

    .game-shell {
      width: min(92vw, 500px);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      color: #fff8bd;
      text-shadow: 0 3px #9b639e;
    }

    .panel {
      position: relative;
      overflow: hidden;
      border: 5px solid #f9d871;
      border-radius: 24px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(#202867, #4c4ca0 70%, #7c589b);
      touch-action: none;
    }

    .hud {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      pointer-events: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #101139a8;
    }

    #overlay.hidden { display: none; }

    .card {
      max-width: 330px;
      padding: 24px;
      margin: 20px;
      border: 3px solid #ffe585;
      border-radius: 20px;
      background: #282365;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 25px;
      background: #ffcf54;
      color: #372348;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .help { color: #e8e6ff; }
  </style>
</head>

<body>
  <main class="game-shell">
    <h1>⭐ Star Catcher ⭐</h1>

    <section class="panel">
      <canvas id="game" width="500" height="650"></canvas>

      <div class="hud">
        <span id="score">Stars: 0</span>
        <span id="lives">Lives: 3</span>
      </div>

      <div id="overlay">
        <div class="card">
          <h2 id="message">Ready?</h2>
          <p id="instructions">Use arrows, mouse, or finger drag to catch stars!</p>
          <button id="playButton">Play!</button>
        </div>
      </div>
    </section>

    <p class="help">← → keys • Mouse move • Finger drag</p>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("score");
    const livesText = document.getElementById("lives");
    const overlay = document.getElementById("overlay");
    const message = document.getElementById("message");
    const instructions = document.getElementById("instructions");
    const playButton = document.getElementById("playButton");

    let basket, stars, score, lives, playing, lastTime, spawnTimer;
    const keys = { left: false, right: false };

    function resetGame() {
      basket = { x: 210, y: 572, width: 80, height: 28, speed: 360 };
      stars = [];
      score = 0;
      lives = 3;
      spawnTimer = 0;
      scoreText.textContent = "Stars: 0";
      livesText.textContent = "Lives: 3";
    }

    function startGame() {
      resetGame();
      playing = true;
      overlay.classList.add("hidden");
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    function addStar() {
      const size = 12 + Math.random() * 9;

      /* Speed increases at 15, 30, 45 stars... */
      const level = Math.floor(score / 15);
      const speed = 150 + (level * 80) + Math.random() * 50;

      stars.push({
        x: Math.random() * (500 - size * 2) + size,
        y: -25,
        size: size,
        speed: speed,
        spin: Math.random() * Math.PI
      });
    }

    function update(delta) {
      if (keys.left) basket.x -= basket.speed * delta;
      if (keys.right) basket.x += basket.speed * delta;

      basket.x = Math.max(0, Math.min(500 - basket.width, basket.x));

      spawnTimer += delta;
      const spawnEvery = Math.max(0.38, 0.95 - score * 0.02);

      if (spawnTimer >= spawnEvery) {
        addStar();
        spawnTimer = 0;
      }

      for (let i = stars.length - 1; i >= 0; i--) {
        const star = stars[i];
        star.y += star.speed * delta;
        star.spin += delta * 4;

        const caught =
          star.y + star.size > basket.y &&
          star.y - star.size < basket.y + basket.height &&
          star.x > basket.x &&
          star.x < basket.x + basket.width;

        if (caught) {
          stars.splice(i, 1);
          score++;
          scoreText.textContent = "Stars: " + score;
        } else if (star.y - star.size > 650) {
          stars.splice(i, 1);
          lives--;
          livesText.textContent = "Lives: " + lives;

          if (lives <= 0) gameOver();
        }
      }
    }

    function drawStar(x, y, radius, rotation) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.beginPath();

      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? radius : radius * 0.44;
        const angle = -Math.PI / 2 + i * Math.PI / 5;

        if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
        else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
      }

      ctx.closePath();
      ctx.fillStyle = "#fff28a";
      ctx.shadowColor = "#ffe85c";
      ctx.shadowBlur = 14;
      ctx.fill();
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, 500, 650);

      ctx.fillStyle = "white";
      const dots = [[60,90], [430,120], [108,260], [382,335], [45,480], [457,460]];
      for (const dot of dots) ctx.fillRect(dot[0], dot[1], 3, 3);

      for (const star of stars) {
        drawStar(star.x, star.y, star.size, star.spin);
      }

      ctx.fillStyle = "#e97d67";
      ctx.fillRect(basket.x, basket.y, basket.width, basket.height);

      ctx.fillStyle = "#ffe4ad";
      ctx.fillRect(basket.x + 7, basket.y + 6, basket.width - 14, 9);

      ctx.fillStyle = "#b34c68";
      ctx.fillRect(basket.x + 10, basket.y + basket.height, basket.width - 20, 6);
    }

    function gameLoop(now) {
      if (!playing) return;

      const delta = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      update(delta);
      draw();

      if (playing) requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      playing = false;
      message.textContent = "Game Over!";
      instructions.textContent = "You caught " + score + " stars!";
      playButton.textContent = "Play Again";
      overlay.classList.remove("hidden");
    }

    function moveBasket(event) {
      if (!playing) return;

      const rect = canvas.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * 500;

      basket.x = Math.max(
        0,
        Math.min(500 - basket.width, x - basket.width / 2)
      );
    }

    window.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") {
        keys.left = true;
        event.preventDefault();
      }

      if (event.key === "ArrowRight") {
        keys.right = true;
        event.preventDefault();
      }
    });

    window.addEventListener("keyup", event => {
      if (event.key === "ArrowLeft") keys.left = false;
      if (event.key === "ArrowRight") keys.right = false;
    });

    /* Mouse movement + finger drag */
    canvas.addEventListener("pointermove", moveBasket);

    playButton.addEventListener("click", startGame);

    resetGame();
    draw();
  </script>
</body>
</html>
